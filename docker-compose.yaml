services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/app.db:/app/data/app.db
      - ./models:/app/models

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    environment:
      - API_URL=http://nginx
    ports:
      - "8501:8501"
    depends_on:
      - nginx
  
